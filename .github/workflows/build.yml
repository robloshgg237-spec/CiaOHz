name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unzip project
        run: |
          unzip -q ./*.zip -d proj
          echo "DIR=$(dirname "$(find proj -name settings.gradle.kts | head -1)")" >> $GITHUB_ENV
      - name: Build
        run: gradle assembleDebug --no-daemon
        working-directory: ${{ env.DIR }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: ${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk
